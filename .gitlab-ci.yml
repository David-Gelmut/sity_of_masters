stages:
  - build
  - deploy

variables:
  REGISTRY: "registry.gitlab.com/davidgelmut-group/sity_of_masters"

before_script:
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

# ==========================================
# СБОРКА ОБРАЗОВ (В облаке GitLab)
# ==========================================

app_build_dev:
  stage: build
  tags:
    - deploy
  only:
    - dev
  script:
    - docker build --build-arg NODE_ENV="dev" -t "$REGISTRY/dev/app:$CI_COMMIT_SHA" -f ./backend/docker/gitlab/Dockerfile .
    - docker push "$REGISTRY/dev/app:$CI_COMMIT_SHA"

app_build_prod:
  stage: build
  tags:
    - deploy
  only:
    - main
  script:
    - docker build --build-arg NODE_ENV="prod" -t "$REGISTRY/prod/app:$CI_COMMIT_SHA" -f ./backend/docker/gitlab/Dockerfile .
    - docker push "$REGISTRY/prod/app:$CI_COMMIT_SHA"

# ==========================================
# ДЕПЛОЙ НА СЕРВЕР (Локальный раннер)
# ==========================================

# 1. ДЕВ-СРЕДА (Ветка develop)
dev_deploy:
  stage: deploy
  tags:
    - deploy
  only:
    - dev
  script:
    - export IMAGE_TAG="$REGISTRY/dev/app:$CI_COMMIT_SHA"
    - export CONTAINER_PREFIX="project_dev"
    - cd /var/www/dev.davidgelmut.ru
    - cp "$DEV_ENV" backend/.env
    - docker compose -p $CONTAINER_PREFIX -f docker-compose.dev.yml down --remove-orphans
    - docker compose -p $CONTAINER_PREFIX -f docker-compose.dev.yml up -d
    - docker exec ${CONTAINER_PREFIX}_app composer install
    - docker exec ${CONTAINER_PREFIX}_app php artisan migrate
    - docker exec ${CONTAINER_PREFIX}_app php artisan cache:clear
    - docker exec ${CONTAINER_PREFIX}_app php artisan config:cache
    - docker exec ${CONTAINER_PREFIX}_app php artisan route:cache


# 2. ПРОД-СРЕДА (Ветка main)
prod_deploy:
  stage: deploy
  tags:
    - deploy
  only:
    - main
    - tags
  when: manual # Прод запускаем только вручную по кнопке в интерфейсе GitLab
  script:
    - export IMAGE_TAG="$REGISTRY/prod/app:$CI_COMMIT_SHA"
    - export CONTAINER_PREFIX="project_prod"
    - cd /var/www/davidgelmut.ru
    - cp "$PROD_ENV" backend/.env
    - docker compose -p $CONTAINER_PREFIX -f docker-compose.prod.yml down --remove-orphans
    - docker compose -p $CONTAINER_PREFIX -f docker-compose.prod.yml up -d
    - docker exec ${CONTAINER_PREFIX}_app composer install
    - docker exec ${CONTAINER_PREFIX}_app php artisan migrate
    - docker exec ${CONTAINER_PREFIX}_app php artisan cache:clear
    - docker exec ${CONTAINER_PREFIX}_app php artisan config:cache
    - docker exec ${CONTAINER_PREFIX}_app php artisan route:cache
