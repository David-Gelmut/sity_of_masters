services:

  app:
    image: "registry.gitlab.com/davidgelmut-group/sity_of_masters/prod/app:$CI_COMMIT_SHA"
    container_name: ${CONTAINER_PREFIX}_app
    restart: unless-stopped
    working_dir: /var/www
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    shm_size: '2gb'
    ports:
      - ${APP_PORT}:80
    volumes:
      - ./backend/docker/nginx.conf:/etc/nginx/nginx.conf
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/uploads.conf
      - ./backend/docker/php.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./backend:/var/www
    #env_file:
    #  - backend/.env
    depends_on:
      - mysql
      - redis
    networks:
      - app-network

  queue-worker:
    image: "registry.gitlab.com/davidgelmut-group/sity_of_masters/prod/app:$CI_COMMIT_SHA"
    container_name: ${CONTAINER_PREFIX}_worker
    restart: unless-stopped
    working_dir: /var/www
    command:  php artisan queue:work --queue=default,reverb --sleep=3 --tries=3 --timeout=600
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    shm_size: '2gb'
    volumes:
      - ./backend/:/var/www
    #env_file:
    #  - ./backend/.env
    depends_on:
      - mysql
      - redis
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ${CONTAINER_PREFIX}_rabbitmq
    restart: unless-stopped
    ports:
      - ${RABBITMQ_PORT}:5672 # Порт для обмена сообщениями
      - ${RABBITMQ_PANEL_PORT}:15672 # Веб-панель управления (логин/пароль ниже)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    #env_file:
    #  - ./backend/.env
    depends_on:
      - queue-worker
      - reverb
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: ${CONTAINER_PREFIX}_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - ${DB_EXPOSE_PORT}:3306
    volumes:
      - mysql_data:/var/lib/mysql
    #env_file:
    #  - ./backend/.env
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: ${CONTAINER_PREFIX}_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - ${REDIS_PORT}:6379
    networks:
      - app-network

  reverb:
    image: "registry.gitlab.com/davidgelmut-group/sity_of_masters/prod/app:$CI_COMMIT_SHA"
    container_name: ${CONTAINER_PREFIX}_reverb
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - ./backend:/var/www
    ports:
      - ${REVERB_PORT}:8080
    depends_on:
      - mysql
    networks:
      - app-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  app-network:
    driver: bridge
